function fit() {
  let s;
  if (TOUCH) {
    const land = innerWidth > innerHeight;
    s = land ? Math.min((innerWidth - 380) / 256, (innerHeight - 16) / 224) : Math.min((innerWidth - 8) / 256, (innerHeight - 230) / 224);

}

function drawSpr(s, x, y, flip = false, scale = 2) {
  cx.save();
  if (flip) { cx.translate(Math.round(x) + 8 * scale, Math.round(y)); cx.scale(-scale, scale); }
  else { cx.translate(Math.round(x), Math.round(y)); cx.scale(scale, scale); }
  cx.drawImage(s, 0, 0); cx.restore();
}

// ---------- maze generator (seeded, so every playthrough is the same) ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const D4 = [[1,0],[-1,0],[0,1],[0,-1]];
function genMaze(o) {
  const W = o.cw * 2 + 1, H = o.ch * 2 + 1, R = rng(o.seed);
  const m = Array.from({ length: H }, () => Array(W).fill('#'));
  const vis = new Set([o.start + '']), stack = [o.start.slice()];
  m[o.start[1] * 2 + 1][o.start[0] * 2 + 1] = '.';
  while (stack.length) {
    const [cx_, cy] = stack[stack.length - 1];
    const nb = D4.map(([dx, dy]) => [cx_ + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < o.cw && y < o.ch && !vis.has(x + ',' + y));
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(R() * nb.length)];
    m[cy * 2 + 1 + dy][cx_ * 2 + 1 + dx] = '.'; m[ny * 2 + 1][nx * 2 + 1] = '.';
    vis.add(nx + ',' + ny); stack.push([nx, ny]);
  }
  for (let cy = 0; cy < o.ch; cy++) for (let cx_ = 0; cx_ < o.cw; cx_++) {          // braid: knock out some dead ends
    const x = cx_ * 2 + 1, y = cy * 2 + 1;
    if (D4.filter(([dx, dy]) => m[y + dy][x + dx] !== '#').length === 1 && R() < o.braid) {

function updateBoss(dt) {
  const B = S.boss; if (!B || B.dead) return;
  B.x += B.vx * dt;
  if (B.x < 24 || B.x > 200) { B.vx *= -1; B.x = Math.max(24, Math.min(200, B.x)); }
  if (B.kind !== 'grimble') B.y = (B.kind === 'mothrael' ? 30 : 28) + Math.sin(S.t * 1.7) * 8;
  if (B.flash > 0) B.flash -= dt;
  const bx = B.x + 16, by = B.y + 16, px = S.p.px + 8, py = S.p.py + 8;
  const aim = Math.atan2(py - by, px - bx);
  if (B.kind === 'malvoren' && B.phase === 1 && B.hp <= 3) {            // phase 2
    B.phase = 2; B.vx *= 1.25; S.proj = []; B.t = 1.6; say(T().phase2);
  }
  B.t -= dt;
  if (B.t <= 0) {
    B.cyc++;
    if (B.kind === 'grimble') {
      const rage = B.hp <= 1;
      for (const a of rage ? [-0.38, -0.13, 0.13, 0.38] : [-0.28, 0, 0.28]) shoot(bx, by, aim + a, 92, 'quiz');
      B.t = rage ? 1.2 : 1.38;
    } else if (B.kind === 'mothrael') {
      const c = B.cyc % 3;
      if (c === 1) { const n = 14, off = B.cyc * 0.4; for (let k = 0; k < n; k++) shoot(bx, by, off + k * Math.PI * 2 / n, 80, 'dust'); B.t = 1.0; }
      else if (c === 2) { for (const a of [-0.4, -0.2, 0, 0.2, 0.4]) shoot(bx, by, aim + a, 112, 'dust'); B.t = 0.9; }
      else { B.burst = 12; B.burstT = 0; B.t = 1.5; }
    } else {
      const p2 = B.phase === 2, c = B.cyc % 3;
      if (c === 1) { const n = p2 ? 17 : 15, off = Math.random(); for (let k = 0; k < n; k++) shoot(bx, by, off + k * Math.PI * 2 / n, p2 ? 74 : 66, 'orb'); B.t = p2 ? 1.0 : 1.2; }
      else if (c === 2) { for (const a of p2 ? [-0.5, -0.3, -0.1, 0.1, 0.3, 0.5] : [-0.4, -0.2, 0, 0.2, 0.4]) shoot(bx, by, aim + a, p2 ? 112 : 100, 'orb'); B.t = p2 ? 0.95 : 1.15; }
      else { B.burst = p2 ? 12 : 9; B.burstT = 0; B.t = p2 ? 1.5 : 1.7; }
    }
    sfx('shoot');
  }
  if (B.burst > 0 && (B.burstT -= dt) <= 0) {                       // spiral streams
    B.burst--; B.burstT = B.kind === 'mothrael' ? 0.14 : 0.1; B.spin += B.kind === 'mothrael' ? 0.55 : 0.48;
    const arms = B.kind === 'mothrael' ? 3 : (B.phase === 2 ? 4 : 3);
    for (let a = 0; a < arms; a++) shoot(bx, by, B.spin + a * Math.PI * 2 / arms, B.kind === 'mothrael' ? 90 : 92, B.kind === 'mothrael' ? 'dust' : 'orb');
  }
  if (!S.orb) {
    if ((S.orbT -= dt) <= 0) {
      const spots = [];
      S.L.map.forEach((row, y) => row.forEach((c, x) => {
        if (c === '.' && y >= 5 && y <= 11 && Math.abs(x - S.p.x) + Math.abs(y - S.p.y) > 3) spots.push([x, y]);
      }));
      const [ox, oy] = spots[Math.floor(Math.random() * spots.length)];
      S.orb = { x: ox * 16, y: oy * 16, fly: false };
    }
  } else if (!S.orb.fly) {
    if (Math.abs(S.orb.x - S.p.px) < 12 && Math.abs(S.orb.y - S.p.py) < 12) { S.orb.fly = true; sfx('key'); }
  } else {
    const o = S.orb, dx = bx - (o.x + 8), dy = by - (o.y + 8), d = Math.hypot(dx, dy);
    if (d < 14) {
      B.hp--; B.flash = 0.45; S.orb = null; S.orbT = B.kind === 'malvoren' ? 1.4 : 1.1; sfx('boom');
      if (B.hp <= 0) { B.dead = true; S.proj = []; say(T().defeat, () => { S.L.map[6][7] = 'p'; sfx('gate'); }); }
    } else { o.x += dx / d * 240 * dt; o.y += dy / d * 240 * dt; }
  }
}
function shoot(x, y, ang, sp, kind) { S.proj.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, kind }); }
function updateProj(dt) {
  const m = S.L.map;
  S.proj = S.proj.filter(q => {
    q.x += q.vx * dt; q.y += q.vy * dt;
    const tx = Math.floor(q.x / 16), ty = Math.floor(q.y / 16);
    if (tx < 0 || tx > 15 || ty < 0 || ty > 12 || solidFor(m[ty][tx])) return false;
    if (Math.abs(q.x - (S.p.px + 8)) < 6 && Math.abs(q.y - (S.p.py + 8)) < 6) { hurt('OUCH!'); return false; }

}

function startTrain() { S.mode = 'train'; S.train = { pos: 0, speed: 56, state: 'ride', wait: 0, msg: 'GET OFF AT: ' + CONFIG.trainStop, msgT: 99 }; }
const stopX = i => 16 + i * (224 / (TRAIN_STOPS.length - 1));

  const R = S.train; if (R.state === 'done') return;

    R.state = 'done'; R.doneT = 0.7; sfx('gate');

}
function updateTrain(dt) {
  const R = S.train; if (R.msgT < 99) R.msgT -= dt;

  if (R.msgT <= 0) { R.msg = 'GET OFF AT: ' + CONFIG.trainStop; R.msgT = 99; }
  const tx = stopX(trainTarget());
  if (R.state === 'ride') {
    R.pos += R.speed * dt;
    if (R.pos >= tx && trainTarget() === TRAIN_STOPS.length - 1) { R.pos = tx; R.state = 'dwell'; R.wait = 0.55; sfx('blip'); }

  } else if (R.state === 'back') {

}

(function touchControls() {
  const pad = document.getElementById('dpad'), arrows = { u: 'arrowup', d: 'arrowdown', l: 'arrowleft', r: 'arrowright' };
  let padId = null;
  const setDir = dir => {
    for (const k of Object.values(arrows)) held[k] = false;

    if (dir) press(arrows[dir], false);

    if (Math.hypot(dx, dy) < 14) return null;

  };
  let cur = null;
  pad.addEventListener('pointerdown', e => { e.preventDefault(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); cur = dirFrom(e); setDir(cur); });
  pad.addEventListener('pointermove', e => { if (e.pointerId !== padId) return; const d = dirFrom(e); if (d !== cur) { cur = d; setDir(d); } });
  const end = e => { if (e.pointerId !== padId) return; padId = null; cur = null; setDir(null); };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
