function spr(rows, pal = PAL) {
  const c = document.createElement('canvas'); c.width = 8; c.height = 8;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}

function drawSpr(s, x, y, flip = false, scale = 2) {
  cx.save();
  if (flip) { cx.translate(x + 8 * scale, y); cx.scale(-scale, scale); }
  else { cx.translate(x, y); cx.scale(scale, scale); }
  cx.drawImage(s, 0, 0); cx.restore();
}

// ---------- state ----------

const T = () => CONFIG.levels[S.level];

// ---------- rules ----------
function solidFor(ch) { return !WALK.has(ch); }
function tryMove(dx, dy) {
  const p = S.p, Lv = S.L, m = Lv.map;
  p.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
  const nx = p.x + dx, ny = p.y + dy;
  if (nx < 0 || nx > 15 || ny < 0 || ny > 12) return;
  const ch = m[ny][nx];
  const blk = Lv.blocks.find(b => b.x === nx && b.y === ny);
  if (blk) {
    const bx = nx + dx, by = ny + dy;
    if (bx < 0 || bx > 15 || by < 0 || by > 12) return;
    if (!WALK.has(m[by][bx]) || Lv.blocks.some(b => b.x === bx && b.y === by)) return;
    blk.x = bx; blk.y = by; sfx('push'); checkPlates();
  } else if (ch === 'S') {
    const signs = T().signs || [], all = [];
    m.forEach((row, y) => row.forEach((c, x) => { if (c === 'S') all.push(x + ',' + y); }));
    const idx = Math.max(0, all.indexOf(nx + ',' + ny));
    if (signs.length) say(signs[Math.min(idx, signs.length - 1)]);
    return;
  } else if (ch === 'D') {
    if (S.keys > 0) { S.keys--; m[ny][nx] = '.'; sfx('door'); say(['The KEY fits! The door swings open.']); }
    else say(["It's locked. There must be a KEY around here somewhere..."]);
    return;
  } else if (ch === 'Q') {
    if (Lv.hoopsDone) say(['Nothing but net. You already won the KEY!']);
    else startHoops();
    return;
  } else if (ch === 'O') {
    const r = Lv.relics.find(o => o.x === nx && o.y === ny);
    const info = RELIC_INFO[r.i % RELIC_INFO.length];
    if (r.i === Lv.keyRelic && !Lv.relicTaken) {
      Lv.relicTaken = true; S.keys++; sfx('key');
      say([info, 'Something glints underneath... wrapped in old velvet: a KEY!']);
    } else say([info, Lv.relicTaken ? 'You already found the key.' : 'No key here. Keep searching.']);
    return;
  } else if (ch === 'C') { openFinale(); return; }
  else if (!WALK.has(ch)) return;
  p.moving = true; p.t = 0; p.fx = p.x; p.fy = p.y; p.x = nx; p.y = ny; p.step ^= 1;
}
function checkPlates() {
  const Lv = S.L; let plates = 0, covered = 0;
  Lv.map.forEach((row, y) => row.forEach((ch, x) => { if (ch === 'X') { plates++; if (Lv.blocks.some(b => b.x === x && b.y === y)) covered++; } }));
  if (plates && plates === covered && Lv.map.some(r => r.includes('G'))) {
    Lv.map.forEach(row => row.forEach((ch, x) => { if (ch === 'G') row[x] = '.'; }));
    sfx('gate'); say(['*CLICK*', 'The gate swung open!']);
  }
}
function arrive() {
  const p = S.p, Lv = S.L, m = Lv.map, ch = m[p.y][p.x];
  if (ch === 'k') { S.keys++; m[p.y][p.x] = '.'; sfx('key'); say(['You found a KEY!']); }
  if (ch === 'f') {
    m[p.y][p.x] = '.'; Lv.peaches--; sfx('key');
    if (Lv.peaches > 0) say([`A ripe peach! ${Lv.peaches} left to pick.`]);
    else { Lv.map.forEach(row => row.forEach((c, x) => { if (c === 'G') row[x] = '.'; })); sfx('gate'); say(['That was the last peach!', 'The farm stand gate swings open.']); }
  }
  if (ch === 'p') { m[p.y][p.x] = '.'; levelClear(); }
}
function levelClear() {
  sfx('piece'); S.hearts = S.level + 1; save(S.level + 1);
  say(['You found a HEART! (' + S.hearts + ' of ' + TOTAL_HEARTS + ')', ...(T().clear || [])], () => { S.mode = 'clear'; });
}
function hurt(msg) {
  if (S.inv > 0 || S.dialog) return;
  S.hp--; S.inv = 1.3; sfx('hit'); S.flash = { msg, t: 0.9 };
  if (S.hp <= 0) {

      p.x = S.start.x; p.y = S.start.y; p.px = p.x * 16; p.py = p.y * 16; p.moving = false;
      S.hp = S.maxhp; S.inv = 1.5; S.trail = [];

// ---------- boss logic ----------
function updateBoss(dt) {
  const B = S.boss; if (!B || B.dead) return;
  B.x += B.vx * dt;
  if (B.x < 24 || B.x > 200) { B.vx *= -1; B.x = Math.max(24, Math.min(200, B.x)); }
  if (B.flash > 0) B.flash -= dt;
  B.t -= dt;
  const bx = B.x + 16, by = B.y + 16, px = S.p.px + 8, py = S.p.py + 8;
  const aim = Math.atan2(py - by, px - bx);
  if (B.t <= 0) {
    B.cyc++;
    if (B.kind === 'grimble') {
      const rage = B.hp <= 1 ? 1 : 0;
      for (const a of rage ? [-0.38, -0.13, 0.13, 0.38] : [-0.28, 0, 0.28]) shoot(bx, by, aim + a, 88, 'quiz');
      B.t = rage ? 1.25 : 1.45; sfx('shoot');
    } else {
      if (B.cyc % 2) { const n = 12, off = Math.random(); for (let k = 0; k < n; k++) shoot(bx, by, off + k * Math.PI * 2 / n, 62, 'orb'); }
      else for (const a of [-0.36, -0.18, 0, 0.18, 0.36]) shoot(bx, by, aim + a, 92, 'orb');
      B.t = B.hp <= 2 ? 1.45 : 1.75; sfx('shoot');
    }
  }
  // the player's weapon: glowing orbs
  if (!S.orb) {
    if ((S.orbT -= dt) <= 0) {
      const spots = [];
      S.L.map.forEach((row, y) => row.forEach((c, x) => {
        if (c === '.' && y >= 5 && y <= 11 && Math.abs(x - S.p.x) + Math.abs(y - S.p.y) > 3) spots.push([x, y]);
      }));
      const [ox, oy] = spots[Math.floor(Math.random() * spots.length)];
      S.orb = { x: ox * 16, y: oy * 16, fly: false };
    }
  } else if (!S.orb.fly) {
    if (Math.abs(S.orb.x - S.p.px) < 12 && Math.abs(S.orb.y - S.p.py) < 12) { S.orb.fly = true; sfx('key'); }
  } else {
    const o = S.orb, dx = bx - (o.x + 8), dy = by - (o.y + 8), d = Math.hypot(dx, dy);
    if (d < 14) {
      B.hp--; B.flash = 0.45; S.orb = null; S.orbT = 1.1; sfx('boom');
      if (B.hp <= 0) {
        B.dead = true; S.proj = [];
        say(T().defeat, () => { S.L.map[6][7] = 'p'; sfx('gate'); });
      }
    } else { o.x += dx / d * 240 * dt; o.y += dy / d * 240 * dt; }
  }
}
function shoot(x, y, ang, sp, kind) { S.proj.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, kind }); }
function updateProj(dt) {
  const m = S.L.map;
  S.proj = S.proj.filter(q => {
    q.x += q.vx * dt; q.y += q.vy * dt;
    const tx = Math.floor(q.x / 16), ty = Math.floor(q.y / 16);
    if (tx < 0 || tx > 15 || ty < 0 || ty > 12 || solidFor(m[ty][tx])) return false;
    if (Math.abs(q.x - (S.p.px + 8)) < 6 && Math.abs(q.y - (S.p.py + 8)) < 6) { hurt('OUCH!'); return false; }
    return true;
  });
}

// ---------- hoops minigame ----------
function startHoops() {
  S.mode = 'hoops';
  S.hoops = { makes: 0, m: 0, dir: 1, speed: 1.0, zone: [0.42, 0.58], shot: null, msg: 'PRESS Z / SPACE TO SHOOT' };
}
function hoopsAction() {
  const H = S.hoops; if (H.shot) return;
  H.shot = { t: 0, make: H.m >= H.zone[0] && H.m <= H.zone[1] }; sfx('push');
}
function updateHoops(dt) {
  const H = S.hoops;
  if (H.shot) {
    H.shot.t += dt / 0.9;
    if (H.shot.t >= 1) {
      if (H.shot.make) {
        H.makes++; sfx('piece'); H.msg = ['SWISH!', 'BUCKET!', 'NOTHING BUT NET!'][H.makes - 1];
        const w = [0.16, 0.12, 0.1][Math.min(H.makes, 2)], c = 0.3 + Math.random() * 0.4;
        H.zone = [c - w / 2, c + w / 2]; H.speed += 0.28;
        if (H.makes >= 3) { S.L.hoopsDone = true; S.keys++; S.mode = 'play'; say(T().hoopsWin); }
      } else { sfx('hit'); H.msg = ['BRICK! TRY AGAIN', 'OFF THE RIM!', 'SO CLOSE!'][Math.floor(Math.random() * 3)]; }
      H.shot = null;

    return;

  H.m += H.dir * H.speed * dt;
  if (H.m > 1) { H.m = 1; H.dir = -1; } if (H.m < 0) { H.m = 0; H.dir = 1; }
}

// ---------- 7 train minigame ----------
function startTrain() {
  S.mode = 'train';
  S.train = { pos: 0, speed: 46, state: 'ride', wait: 0, msg: 'GET OFF AT: ' + CONFIG.trainStop, msgT: 99 };
}
const stopX = i => 16 + i * (224 / (TRAIN_STOPS.length - 1));
function trainTarget() { return Math.max(0, TRAIN_STOPS.indexOf(CONFIG.trainStop)); }
function trainAction() {
  const R = S.train; if (R.state === 'done') return;
  const tx = stopX(trainTarget());
  if (Math.abs(R.pos - tx) <= 5 || R.state === 'dwell') {
    R.state = 'done'; sfx('gate');
    setTimeout(() => { S.L.trainDone = true; S.keys++; S.mode = 'play'; say(T().trainWin); }, 700);
  } else { sfx('hit'); R.msg = 'NOT THIS STOP! STAND CLEAR OF THE CLOSING DOORS!'; R.msgT = 1.6; }
}
function updateTrain(dt) {
  const R = S.train; if (R.msgT < 99) R.msgT -= dt;
  if (R.msgT <= 0) { R.msg = 'GET OFF AT: ' + CONFIG.trainStop; R.msgT = 99; }
  const tx = stopX(trainTarget());
  if (R.state === 'ride') {
    R.pos += R.speed * dt;
    if (R.pos >= tx && trainTarget() === TRAIN_STOPS.length - 1) { R.pos = tx; R.state = 'dwell'; R.wait = 0.75; sfx('blip'); }
    else if (R.pos > tx + 6) { R.state = 'back'; }
  } else if (R.state === 'dwell') {
    if ((R.wait -= dt) <= 0) { R.state = 'back'; sfx('hit'); R.msg = 'TOO LATE! THE 7 HEADS BACK TO MANHATTAN...'; R.msgT = 2; }
  } else if (R.state === 'back') {
    R.pos -= R.speed * 3 * dt;
    if (R.pos <= 0) { R.pos = 0; R.state = 'ride'; R.speed = Math.max(40, R.speed - 3); }
  }
}

// ---------- input ----------
const held = {}, KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let kseq = [];
const DIRS = { arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1], arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0] };
function action() {
  if (S.mode === 'title') return startGame(false);
  if (S.mode === 'prologue') {
    const P = S.pro, line = CONFIG.prologue[P.i];
    if (P.chars < line.length) { P.chars = line.length; return; }
    P.i++; P.chars = 0; sfx('blip');
    if (P.i >= CONFIG.prologue.length) S.mode = 'card';
    return;
  }
  if (S.dialog) return advanceDialog();
  if (S.mode === 'card') { S.mode = S.L.def.train ? 'train' : 'play'; if (S.L.def.train) startTrain(); say(T().intro); return; }
  if (S.mode === 'clear') return loadLevel(S.level + 1);
  if (S.mode === 'hoops') return hoopsAction();
  if (S.mode === 'train') return trainAction();
  if (S.mode === 'finale') {
    const F = S.fin, line = CONFIG.finalWords[F.i];
    if (F.chars < line.length) { F.chars = line.length; return; }
    F.i++; F.chars = 0;
    if (F.i >= CONFIG.finalWords.length) { S.mode = 'portal'; S.portalT = 0; sfx('secret'); }
    return;
  }
  if (S.mode === 'end') { S.mode = 'title'; return; }
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  audio(); held[k] = true;
  kseq.push(k); kseq = kseq.slice(-10);
  if (kseq.join() === KONAMI.join() && !S.rainbow) {
    S.rainbow = true; S.maxhp = 5; sfx('secret');
    if (S.mode === 'play') { S.hp = S.maxhp; say(CONFIG.konami); } else S.cheatT = 3;
    return;
  }
  if (e.repeat) return;
  if (k === 'm') { toggleMusic(); return; }
  if (S.mode === 'title' && k === 'n' && saved > 0) { startGame(true); return; }
  if (S.mode === 'play' && !S.dialog && k === 'r' && S.L.orig.length) { S.L.blocks = S.L.orig.map(b => ({ ...b })); sfx('push'); return; }
  if (k === 'z' || k === ' ' || k === 'enter' || k === 'x') action();
});
addEventListener('keyup', e => { held[e.key.toLowerCase()] = false; });
cv.addEventListener('pointerdown', () => { audio(); if (S.mode !== 'play' || S.dialog) action(); });
function startGame(fresh) {

  const lvl = fresh ? 0 : Math.min(saved, LEVELS.length - 1);
  if (lvl === 0) { loadLevel(0); S.mode = 'prologue'; S.pro = { i: 0, chars: 0 }; }
  else loadLevel(lvl);

// ---------- sound ----------
let AC = null, musicOn = true, loopAt = 0, live = [], song = 'main';
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = {
  main: { beat: 0.3, mel: [[76,1],[79,1],[81,1],[79,1],[76,1.5],[74,.5],[72,2],[74,1],[76,1],[79,1],[76,1],[74,3],[0,1],
                           [76,1],[79,1],[81,1],[84,1],[83,1.5],[81,.5],[79,2],[81,1],[79,1],[76,1],[74,1],[72,3],[0,1]],
          bass: [48,45,41,43,48,45,41,43] },
  boss: { beat: 0.19, mel: [[69,1],[72,1],[76,1],[72,1],[69,1],[72,1],[77,1],[76,1],[74,1],[71,1],[68,1],[71,1],[76,2],[75,2],
                            [69,1],[72,1],[76,1],[81,1],[79,1],[77,1],[76,1],[74,1],[72,1],[71,1],[69,1],[68,1],[69,4]],
          bass: [45,45,41,41,40,40,45,40] },
  final: { beat: 0.46, mel: [[72,2],[76,2],[79,3],[77,1],[76,2],[74,2],[72,4],[69,2],[72,2],[76,3],[74,1],[72,2],[71,2],[72,4]],
           bass: [48,45,41,43,48,45,41,48] },
};
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); loopAt = AC.currentTime + 0.1; } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, t0, d, type = 'square', vol = 0.05, track) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.03);
  if (track) live.push(o);
}
function songLen(sg) { return sg.mel.reduce((a, [, d]) => a + d, 0); }
function scheduleLoop(t0) {
  const sg = SONGS[song]; let b = 0;
  for (const [n, d] of sg.mel) { if (n) tone(midi(n), t0 + b * sg.beat, d * sg.beat * 0.9, 'square', 0.03, true); b += d; }
  const len = songLen(sg), per = len / sg.bass.length;
  sg.bass.forEach((n, i) => { tone(midi(n), t0 + i * per * sg.beat, per * sg.beat * 0.45, 'triangle', 0.09, true);
                              tone(midi(n), t0 + (i + 0.5) * per * sg.beat, per * sg.beat * 0.45, 'triangle', 0.09, true); });
  return len * sg.beat;
}
setInterval(() => {
  if (!AC || !musicOn || AC.state !== 'running') return;
  if (AC.currentTime > loopAt - 0.4) {
    if (loopAt < AC.currentTime) loopAt = AC.currentTime + 0.05;
    live = []; loopAt += scheduleLoop(loopAt);
  }
}, 100);
function stopMusic() { live.forEach(o => { try { o.stop(); } catch (e) {} }); live = []; }
function setSong(n) { if (song === n) return; song = n; stopMusic(); if (AC) loopAt = AC.currentTime + 0.05; }
function toggleMusic() { musicOn = !musicOn; if (!musicOn) stopMusic(); else if (AC) loopAt = AC.currentTime + 0.05; }
function sfx(n) {
  if (!AC) return;
  const t = AC.currentTime;
  const X = {
    piece: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.08, 0.14, 'square', 0.06)),
    key: () => { tone(880, t, 0.08); tone(1320, t + 0.08, 0.14); },
    push: () => tone(110, t, 0.08, 'triangle', 0.12),
    door: () => { tone(196, t, 0.1); tone(262, t + 0.1, 0.16); },
    hit: () => { tone(220, t, 0.1, 'sawtooth', 0.06); tone(110, t + 0.1, 0.22, 'sawtooth', 0.06); },
    blip: () => tone(990, t, 0.02, 'square', 0.02),
    voice: () => tone(180 + Math.random() * 30, t, 0.04, 'square', 0.03),
    shoot: () => tone(330, t, 0.06, 'square', 0.025),
    boom: () => { tone(90, t, 0.25, 'sawtooth', 0.09); tone(60, t + 0.05, 0.3, 'triangle', 0.12); },
    gate: () => [392, 523, 659].forEach((f, i) => tone(f, t + i * 0.1, 0.16)),
    secret: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, t + i * 0.06, 0.1, 'square', 0.05)),
  };
  (X[n] || (() => {}))();
}

// ---------- drawing helpers ----------
function text(s, x, y, col = '#fff', size = 8, align = 'left') {
  cx.font = `${size}px "Press Start 2P", monospace`; cx.fillStyle = col;
  cx.textAlign = align; cx.textBaseline = 'top'; cx.fillText(s, x, y);
}
function wrap(s, n) {
  const lines = []; let l = '';
  for (const w of s.split(' ')) {
    if ((l + ' ' + w).trim().length > n) { if (l.trim()) lines.push(l.trim()); l = w; } else l += ' ' + w;
  }
  if (l.trim()) lines.push(l.trim());

}
function drawTile(ch, x, y, th, L) {

  if (L.stars && (x * 7 + y * 13) % 5 === 0) { cx.fillStyle = (Math.floor(S.t * 2 + x + y) % 4) ? '#6a52a3' : '#fff'; cx.fillRect(X + 5, Y + 6, 1, 1); }
  switch (ch) {
    case '#':

      cx.fillRect(X + (y % 2 ? 0 : 8), Y + 7, 1, 7); cx.fillRect(X, Y + 7, 16, 1);

  cx.fillStyle = '#fff'; cx.fillRect(8, 128, 240, 88); cx.fillStyle = '#000'; cx.fillRect(11, 131, 234, 82);
  let left = Math.floor(F.chars);
  wrap(line, 26).forEach((ln, i) => { text(ln.slice(0, Math.max(0, left)), 20, 142 + i * 14); left -= ln.length + 1; });
}
function drawPortal(dt) {
  S.portalT += dt;
  const t = S.portalT;
  cx.fillStyle = '#05030a'; cx.fillRect(0, 0, 256, 224); stars();
  for (let i = 6; i > 0; i--) {
    const r = (i * 14 + t * 30) % 90;
    cx.strokeStyle = ['#ff5c8a', '#b388ff', '#6ec6ff', '#ffd23f', '#7bd389', '#ff9f1c'][i - 1]; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(128, 100, r, 0, 7); cx.stroke();
  }
  // Earth, getting closer
  const er = Math.min(40, 6 + t * 8);
  cx.fillStyle = '#2b6cb0'; cx.beginPath(); cx.arc(128, 100, er, 0, 7); cx.fill();
  cx.fillStyle = '#3c9a5f'; cx.beginPath(); cx.arc(128 - er * 0.3, 100 - er * 0.2, er * 0.4, 0, 7); cx.arc(128 + er * 0.35, 100 + er * 0.25, er * 0.3, 0, 7); cx.fill();
  drawSpr(SP.down[Math.floor(t * 4) % 2], 120, 160 - Math.min(40, t * 6));
  text(t < 5 ? 'RETURNING TO EARTH...' : 'WELCOME HOME, ' + CONFIG.herName, 128, 196, '#fff', 8, 'center');
  if (t > 7) { S.mode = 'end'; sfx('piece'); save(0); saved = 0; }
}
function drawEnd(dt) {
  cx.fillStyle = '#140a24'; cx.fillRect(0, 0, 256, 224);
  drawParticles(dt, 0.8);
  drawSpr(SP.heart, 96, 34, false, 8);
  text('HEARTS', 128, 112, '#ff5c8a', 16, 'center');
  text('THE END', 128, 136, '#fff', 8, 'center');
  text('LOVE, ' + CONFIG.fromName, 128, 158, '#ffc2d1', 8, 'center');
  if (Math.floor(S.t * 2) % 2) text('PRESS START TO PLAY AGAIN', 128, 192, '#7d6a99', 8, 'center');
}

(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(frame));
window.__game = { S, CONFIG, LEVELS, loadLevel, action };
</script>
